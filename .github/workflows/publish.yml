name: Publish

# Releases used to happen from a laptop: deploy.sh prompted for a version, built
# whatever happened to be in the working tree, and ran `twine upload`. Nothing
# tied the artifact on PyPI to a reviewed commit — or to any commit at all,
# since the script wrote the version bump but never committed it. That is how
# __version__ sat at 0.1.0 while PyPI served 0.1.11.
#
# Publishing from a tag fixes the provenance: the only thing that can reach
# customers is a tagged commit that already reached main, and the two checks
# below refuse anything else before a build starts.
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # Trusted publishing: PyPI verifies this workflow's own OIDC identity, so
      # there is no long-lived API token stored here to leak or rotate. Requires
      # the one-time publisher setup on PyPI described in the README.
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The ancestry check below needs real history, which the default
          # shallow fetch of a single tag ref does not have.
          fetch-depth: 0

      - name: Require the tag to match version.txt
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < version.txt)"
          if [ "$tag_version" != "$file_version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} declares ${tag_version} but version.txt says ${file_version}. setup.py stamps version.txt into the package, so this would publish ${file_version} under a tag naming ${tag_version}."
            exit 1
          fi
          echo "Tag and version.txt agree on ${file_version}."

      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that has not reached origin/main. Customers pip-install this package, so a release has to be merged and reviewed first."
            exit 1
          fi
          echo "Tagged commit is on main."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          # No pip cache, for the same reason as CI: a customer installing today
          # resolves from scratch, so the release check must too.

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt build twine

      - name: Report resolved dependency versions
        run: pip freeze

      - name: Test
        # CI already tested this commit, but dependency resolution moves under a
        # fixed commit — that is exactly how the `mcp` 2.0.0 break arrived — and
        # a release is the last moment where a red check is still free.
        run: pytest -q

      - name: Build
        run: |
          rm -rf build dist ./*.egg-info
          python -m build

      - name: Check the artifacts
        run: |
          twine check dist/*
          ls -l dist/

      - name: Publish to PyPI
        # No skip-existing: a version already on PyPI means the tag or
        # version.txt is wrong, and failing loudly is the point.
        uses: pypa/gh-action-pypi-publish@release/v1
