name: CI

# This package is pip-installed by customers, so a broken release is silent to
# us and arrives one person at a time. That is what happened with `mcp` 2.0.0
# (2026-07-28): it removed the low-level decorators this server is built on, and
# because install_requires had no ceiling, every fresh install since then failed
# on import. Nobody reported it. Nothing here ran to notice.
on:
  # Work on a branch is already covered by the pull_request run, so listing
  # develop here only bought a second identical set of checks on the same
  # commit. push stays for main so the merge commit itself is checked.
  push:
    branches: [main]
  pull_request:
  # Dependency resolution can break with no commit of ours, which is exactly how
  # the 2.0.0 break arrived. A weekly run finds that while it is still a red
  # check rather than a customer install.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Nothing here writes to the repository — it installs, tests and builds — so the
# token these jobs hand to every third-party action and dependency should not be
# able to either. Without this it inherits the repository default, which may be
# read/write.
permissions:
  contents: read

concurrency:
  # A new push to the same ref supersedes whatever is still running for it.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # setup.py claims >=3.10; check the ends of that range rather than
        # trusting the classifier.
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # No pip cache on purpose: a customer installing today resolves from
          # scratch, so CI must too, or it will not see a new major until they do.

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt

      - name: Report resolved dependency versions
        run: pip freeze

      - name: Test
        run: pytest -q

  install-from-built-package:
    # The wheel is what customers actually get. Building and installing it in a
    # clean environment is the only check that covers packaging errors and
    # dependency resolution together — an editable install can hide both.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Install the wheel into a clean environment
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl

      - name: Report what a customer would get
        run: /tmp/fresh/bin/pip freeze

      - name: Construct the server
        # The check that was missing. Installing the packages proves nothing:
        # `mcp` 2.0.0 installs cleanly and only fails when create_server runs.
        run: |
          /tmp/fresh/bin/python -c "
          from prometheux_mcp.server import create_server
          from prometheux_mcp.config import Settings
          server = create_server(Settings(
              url='https://api.prometheux.ai',
              token='ci', username='ci', organization='ci',
          ))
          print('create_server() OK:', server.name)
          "

      - name: Run the console script
        # Catches a broken entry point in setup.py, which no import would show.
        run: /tmp/fresh/bin/prometheux-mcp --help

  secrets:
    name: secret scan (gitleaks, full history)
    # This repository is public, and every release before the tag pipeline was
    # built and uploaded from a laptop, so a credential that reached a commit
    # here is the kind of thing that would have arrived by accident rather than
    # by design. Deleting one from HEAD does not unpublish it either: the old
    # commit stays fetchable, so the fix is a history rewrite plus a rotation.
    # Scanning the whole history rather than the checkout is therefore the only
    # version of this check worth running. prometheux-cli gates on the same job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks walks the commit graph; the default shallow fetch would
          # leave it with one commit to look at.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          VER=8.30.1
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan
        # --redact: a finding must not reprint the secret into a log that is as
        # public as the repository.
        run: gitleaks git . --redact --verbose
